- name: Setup Rclone Config
        env:
          # Questo metodo è sicuro al 100% contro gli errori di formattazione
          JSON_KEY: ${{ secrets.GDRIVE_SA_JSON }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          
          # Scrive il file JSON in modo protetto
          echo "$JSON_KEY" > ~/.config/rclone/sa.json
          
          # Crea il file di configurazione
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = ~/.config/rclone/sa.json
          root_folder_id = $FOLDER_ID
          EOF
