name: Sync Repository to Google Drive

on:
  push:
    branches:
      - main  # Cambia con "master" se il tuo branch principale si chiama master
  workflow_dispatch: # Permette di avviare la sincronizzazione anche manualmente da GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Setup Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.GDRIVE_SA_JSON }}" > ~/.config/rclone/sa.json
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = ~/.config/rclone/sa.json
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Sync to Google Drive
        run: |
          # Sincronizza i file verso Google Drive (escludendo la cartella .git)
          rclone sync . gdrive: --exclude ".git/**" --exclude ".github/**" -v
